logging:
  level:
    root: WARN
    in.shivam.retaillite: DEBUG

spring:
  application:
    name: RetailLite-Test

  datasource:
    url: jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE;MODE=MySQL;NON_KEYWORDS=USER
    username: sa
    password:
    driver-class-name: org.h2.Driver

  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: create-drop
    show-sql: false
    properties:
      hibernate:
        format_sql: true

  h2:
    console:
      enabled: true

  docker:
    compose:
      enabled: false

  servlet:
    multipart:
      max-file-size: 8MB
      max-request-size: 10MB

server:
  servlet:
    context-path: /api/v1.0

app:
  security:
    jwt-secret-key: "ThisIsATestJwtSecretKeyWithAtLeast32Characters!"
    token-expiration-in-minute: 60

aws:
  region: us-east-1
  access-key: test-access-key
  secret-key: test-secret-key
  bucket-name: retail-lite-test
  endpoint: http://localhost:4566

razorpay:
  key-id: test_key
  key-secret: test_secret
  timeout: 10
  webhook-secret: test_webhook_secret

payment:
  pending:
    payment-timeout: 15
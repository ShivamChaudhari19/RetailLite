services:
  mysql:
    image: mysql:8.0.32
    container_name: mysql
    environment:
      MYSQL_ROOT_PASSWORD: shivam
      MYSQL_DATABASE: retail_lite
    ports:
      - "3307:3306"
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-pshivam"]
      timeout: 5s
      retries: 5
      interval: 5s
      start_period: 10s
    volumes:
      - mysql-data:/var/lib/mysql
  app:
    build: .
    image: retail-lite:v1
    container_name: retail-lite-app
    env_file:
      - .env
    ports:
      - "8080:8080"
    depends_on:
      mysql:
         condition: service_healthy
volumes:
  mysql-data: